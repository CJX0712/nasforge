name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  PYTHONPATH: ${{ github.workspace }}

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Upgrade pip
        run: python -m pip install --upgrade pip
        run: pip install ruff pytest

      - name: Install package (dev extra)
        run: echo "no build backend (no pyproject.toml/setup.py); PYTHONPATH covers imports"

      - name: Lint (ruff)
        run: ruff check nasforge

      - name: Run test suite (G1-G12 invariants)
        run: python -m pytest -q

      - name: Demo smoke test
        run: timeout 120 python -m nasforge.cli demo

      - name: Secret scan gate
        run: python scripts/secret_scan.py
